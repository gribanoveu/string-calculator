# Логи MCP SDK пишутся только в stderr: stdout — канал протокола
org.slf4j.simpleLogger.logFile=System.err

# По умолчанию только предупреждения и ошибки, чтобы лог не засорял вывод клиента
org.slf4j.simpleLogger.defaultLogLevel=warn

# Компактный формат: без имени потока reactor
org.slf4j.simpleLogger.showThreadName=false
